name: Publish download website
on:
  push:
    branches: [main]
    paths: ['website/dist/**', 'scripts/check-website.mjs', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # Only the original repository publishes the website. Forks copy this workflow, but they
    # have no GitHub Pages set up, so the deploy would fail and email the fork's owner.
    if: github.repository == 'Harshit-Kandoi/pixel-buddy'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-website.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - uses: actions/deploy-pages@v4
        id: deployment
