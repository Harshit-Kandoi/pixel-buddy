name: Build desktop release
# Runs three ways: called by "Release on merge" for every release (published straight away),
# on a hand-pushed v* tag (creates a draft to publish yourself), or by hand to build test
# artifacts without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.2.0"
        type: string
        required: true
      publish:
        description: "Publish the release instead of leaving a draft"
        type: boolean
        default: false
      notes:
        description: "What's new, in Markdown, shown above the standard release notes"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # Standard hosted runners are free for public repositories. Avoid private-repo charges.
    if: github.event.repository.private == false
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            command: build:win
            arch: x64
            installer: windows-x64.exe
          - os: macos-15
            command: build:mac
            arch: arm64
            installer: mac-arm64.dmg
          - os: macos-15-intel
            command: build:mac
            arch: x64
            installer: mac-x64.dmg
          - os: ubuntu-22.04
            command: build:linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check release version and runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          node <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');
          const ref = process.env.RELEASE_TAG || process.env.GITHUB_REF_NAME;
          const rootVersion = l.packages?.['']?.version;
          console.log(`Ref: ${ref}; package: ${p.version}; lockfile: ${l.version}; lockfile root: ${rootVersion}; runner: ${process.arch}`);
          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }
          if (p.version !== l.version || p.version !== rootVersion) {
            fail(`Package version ${p.version} does not match lockfile versions ${l.version}/${rootVersion}. Update and commit both package files before tagging.`);
          }
          if (process.env.RELEASE_TAG && `v${p.version}` !== ref) {
            fail(`Tag ${ref} points to package version ${p.version}; expected v${p.version}. Commit the version update before creating a new release tag. Re-running this tag uses the same mismatched commit.`);
          }
          if (process.arch !== process.env.EXPECTED_ARCH) {
            fail(`Runner architecture ${process.arch} does not match target ${process.env.EXPECTED_ARCH}.`);
          }
          NODE
      # uiohook-napi is rebuilt for Electron on install and needs the X11 headers on Linux
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxtst-dev libxt-dev libxinerama-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev
      # Electron and electron-builder download large files from GitHub during install and
      # packaging. Keep them between runs (keyed on the exact versions), so a release doesn't
      # depend on those downloads. If GitHub's release downloads fail (a 504 outage sank the
      # first v1.1.1 build), the retries fetch the same files from the npmmirror.com backup;
      # every Electron file is then checked against the official checksums pinned in the
      # electron npm package, and electron-builder's tools against checksums built into it.
      - name: Read Electron versions for the download cache
        id: electron
        shell: bash
        run: |
          echo "key=$(node -p "const l = require('./package-lock.json').packages; [l['node_modules/electron'].version, l['node_modules/electron-builder'].version].join('-')")" >> "$GITHUB_OUTPUT"
      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-downloads-${{ runner.os }}-${{ matrix.arch }}-${{ steps.electron.outputs.key }}
      - name: Install dependencies (GitHub first, backup mirror on retry)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              export ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
              export ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
              echo "::warning::Attempt $attempt downloads Electron from the npmmirror.com backup"
            fi
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt of 3); retrying in 30 seconds"
            sleep 30
          done
          exit 1
      - run: npm test
      - name: Build installers (GitHub first, backup mirror on retry)
        shell: bash
        env:
          COMMAND: ${{ matrix.command }}
          ARCH: ${{ matrix.arch }}
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              export ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
              export ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
              echo "::warning::Attempt $attempt downloads Electron and build tools from the npmmirror.com backup"
            fi
            npm run "$COMMAND" -- "--$ARCH" --publish never && exit 0
            echo "::warning::Build failed (attempt $attempt of 3); retrying in 30 seconds"
            sleep 30
          done
          exit 1
      - name: Check Electron downloads against the official checksums
        run: node scripts/verify-electron-downloads.mjs
      - name: Install DMG and check app launch
        if: runner.os == 'macOS'
        shell: bash
        env:
          INSTALLER_SUFFIX: ${{ matrix.installer }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          dmg="release/pixel-buddy-${version}-${INSTALLER_SUFFIX}"
          hdiutil verify "$dmg"
          mount="$RUNNER_TEMP/pixel-buddy-mount"
          destination="$RUNNER_TEMP/pixel-buddy-installed"
          mkdir -p "$mount" "$destination"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/Pixel Buddy.app" "$destination/Pixel Buddy.app"
          node scripts/smoke-desktop.mjs "$destination/Pixel Buddy.app/Contents/MacOS/Pixel Buddy"
      - name: Install NSIS EXE and check app launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = (Resolve-Path "release/pixel-buddy-$version-windows-x64.exe").Path
          $destination = Join-Path $env:RUNNER_TEMP 'pixel-buddy-installed'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -PassThru
          if (-not $install.WaitForExit(120000)) { $install.Kill(); throw 'Installer timed out' }
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $exe = Join-Path $destination 'pixel-buddy.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable is missing' }
          node scripts/smoke-desktop.mjs "$exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke test failed' }
      - name: Generate platform checksums
        run: npm run release:checksums
      - uses: actions/upload-artifact@v6
        with:
          name: pixel-buddy-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  draft-release:
    if: ${{ inputs.tag || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: pixel-buddy-*
          path: artifacts
      - name: Verify artifacts and assemble complete release
        shell: bash
        run: |
          set -euo pipefail
          mkdir installers
          for directory in artifacts/pixel-buddy-*; do
            (cd "$directory" && sha256sum --check SHA256SUMS)
            find "$directory" -maxdepth 1 -type f ! -name SHA256SUMS -exec cp -n {} installers/ \;
          done
          node scripts/release-checksums.mjs installers --all
          (cd installers && sha256sum --check SHA256SUMS)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES" > release-notes.md; else : > release-notes.md; fi
          cat docs/release-notes.md >> release-notes.md
          if [ "$PUBLISH" = "true" ]; then
            gh release create "$RELEASE_TAG" installers/* --verify-tag --latest --title "Pixel Buddy $RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" installers/* --verify-tag --draft --title "Pixel Buddy $RELEASE_TAG" --notes-file release-notes.md
          fi
