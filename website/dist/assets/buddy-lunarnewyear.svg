<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250" fill="none">
<style>
.twinkle{animation:twinkle 2.4s ease-in-out infinite}.late{animation-delay:1.2s}
.flame{animation:flicker .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.glow{animation:glow 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.bob{animation:bob 3s ease-in-out infinite}
.fall{animation:fall 3s linear infinite}
@keyframes twinkle{50%{opacity:.25}}
@keyframes flicker{to{transform:scale(.9,1.08) rotate(3deg)}}
@keyframes glow{50%{opacity:.15;transform:scale(.85)}}
@keyframes bob{50%{transform:translate(-3px,4px) rotate(-3deg)}}.bob.late{animation-delay:-1.5s}
@keyframes fall{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(14px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
