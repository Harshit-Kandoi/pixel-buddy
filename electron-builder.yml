appId: com.pixelbuddy.desktop
productName: Pixel Buddy
directories:
  buildResources: build
  output: release
files:
  - out/**
  - resources/**
  - package.json
  - LICENSE
asarUnpack:
  - resources/**
win:
  executableName: pixel-buddy
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: pixel-buddy-${version}-windows-${arch}.${ext}
  shortcutName: Pixel Buddy
  uninstallDisplayName: Pixel Buddy
  createDesktopShortcut: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: pixel-buddy-${version}-mac-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: Harshit Kandoi
  category: Utility
  artifactName: pixel-buddy-${version}-linux-${arch}.${ext}
appImage:
  artifactName: pixel-buddy-${version}-linux-${arch}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: Harshit-Kandoi
  repo: pixel-buddy
  releaseType: draft
